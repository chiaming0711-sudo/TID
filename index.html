<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183b56">
<title>啟益科技｜安裝報告書</title>
<style>
:root{--navy:#183b56;--ink:#20303b;--muted:#607482;--line:#d8e1e7;--pale:#f2f5f7;--bg:#edf1f4;--white:#fff;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","Noto Sans TC",sans-serif}
header{background:var(--navy);color:white;padding:18px max(16px,calc((100vw - 980px)/2));position:sticky;top:0;z-index:4;box-shadow:0 2px 10px #112c401a}header strong{font-size:17px}header span{font-size:12px;opacity:.78;margin-left:8px}
main{max-width:980px;margin:18px auto;padding:0 14px 34px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:16px;align-items:start}.panel{background:white;border-radius:var(--radius);padding:16px;box-shadow:0 2px 12px #15334a0d}.form-title{font-size:20px;font-weight:750;color:var(--navy);margin:0 0 4px}.hint{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 16px}.section{font-size:14px;font-weight:700;color:var(--navy);padding:9px 10px;background:var(--pale);border-left:4px solid var(--navy);border-radius:7px;margin:18px 0 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.wide{grid-column:1/-1}label.field{display:block;font-size:12px;color:var(--muted);font-weight:600}input[type=text],input[type=date],input[type=tel],textarea,select{font:inherit;color:var(--ink);width:100%;padding:10px 11px;margin-top:5px;border:1px solid var(--line);border-radius:9px;background:white;min-height:42px}textarea{min-height:82px;resize:vertical}.optiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.optiongrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.option{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;line-height:1.35;min-height:42px}.option input{accent-color:var(--navy);width:18px;height:18px;margin:0;flex:0 0 auto}.qty{display:grid;grid-template-columns:20px minmax(0,1fr) 72px;gap:7px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px}.qty input[type=checkbox]{accent-color:var(--navy);width:18px;height:18px;margin:0}.qty input[type=number]{width:100%;min-width:0;margin:0;min-height:36px;padding:6px 8px}.signbox{border:1px solid var(--line);border-radius:11px;padding:10px;margin:9px 0 14px}.signhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--navy)}.signhead button,.actions button{font:inherit;border:0;border-radius:9px;padding:10px 12px;background:#e8eef2;color:var(--navy);font-weight:650}.signcanvas{display:block;width:100%;height:120px;margin-top:8px;background:#fbfcfd;border:1px dashed #bccbd5;border-radius:8px;touch-action:manipulation;cursor:pointer}.signbuttons{display:flex;gap:6px}.signature-modal[hidden]{display:none!important}.signature-modal{position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;background:#eef2f5;display:flex;flex-direction:column;padding:12px}.signature-top{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.signature-title{font-weight:750;color:var(--navy);font-size:17px}.signature-top .sig-actions{display:flex;gap:7px}.signature-top button{font:inherit;border:0;border-radius:9px;padding:10px 13px;background:#e1e8ed;color:var(--navy);font-weight:650}.signature-top button.primary{background:var(--navy);color:white}.signature-hint{width:100%;order:3;text-align:center;font-size:12px;color:var(--muted)}@media(orientation:landscape){.signature-hint{display:none}}.signature-pad-full{flex:1 1 auto;align-self:stretch;width:100%;height:100%;min-height:0;aspect-ratio:auto;max-height:none;margin-top:12px;background:white;border:1px solid #bdcbd4;border-radius:12px;touch-action:none;overscroll-behavior:contain;box-shadow:0 2px 12px #15334a12}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1;min-width:115px}.actions .primary{background:var(--navy);color:white}.preview-panel{position:sticky;top:76px}.preview-caption{font-size:12px;color:var(--muted);margin:0 0 10px}.paper-wrap{max-height:calc(100vh - 170px);overflow:auto;background:#dce3e8;padding:10px;border-radius:10px}.paper-wrap svg{display:block;width:100%;height:auto;background:white;box-shadow:0 2px 8px #0002}.fineprint{font-size:11px;color:var(--muted);line-height:1.55;margin:12px 2px 0}.image-save-modal[hidden]{display:none!important}.image-save-modal{position:fixed;inset:0;z-index:60;background:#112c40e8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:white;text-align:center}.image-save-modal p{max-width:34em;line-height:1.6}.image-save-modal img{display:block;max-width:100%;max-height:72vh;object-fit:contain;background:white;touch-action:pan-x pan-y;-webkit-touch-callout:default}.image-save-modal button,.image-save-modal a{font:inherit;border:0;border-radius:9px;padding:10px 14px;background:white;color:#183b56;font-weight:700;text-decoration:none;margin:4px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16384e;color:white;padding:10px 15px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:8}.toast.show{opacity:1}
@media(max-width:760px){main{display:block;margin:12px auto;padding:0 10px 24px}.preview-panel{position:static;margin-top:14px}.paper-wrap{max-height:none}.panel{padding:14px}.grid,.grid.three{grid-template-columns:minmax(0,1fr)}.grid input,.grid textarea{min-width:0}.optiongrid.three{grid-template-columns:repeat(2,minmax(0,1fr))}header{position:static}}
@media(max-width:420px){.grid,.grid.three{grid-template-columns:1fr}.optiongrid.three{grid-template-columns:1fr 1fr}.actions button{font-size:13px}.signature-title{width:100%}.signature-top .sig-actions{width:100%;justify-content:flex-end}.signature-top .sig-actions button{font-size:12px;padding:9px 10px}}
@page{size:A4 portrait;margin:10mm}
@media print{body{background:white}header,main>.form-panel,.preview-caption,.fineprint,.toast{display:none!important}main{display:block;max-width:none;margin:0;padding:0}.preview-panel{display:block;position:static;margin:0;padding:0;box-shadow:none;border-radius:0}.preview-panel.panel{padding:0}.paper-wrap{max-height:none;overflow:visible;padding:0;background:white;border-radius:0}.paper-wrap svg{width:190mm;height:268.6mm;box-shadow:none;page-break-after:always;break-after:page}.paper-wrap svg:last-child{page-break-after:auto;break-after:auto}}
</style>
</head>
<body>
<header><strong>啟益科技｜安裝報告書</strong><span>手機簽收版</span></header>
<main>
<section class="panel form-panel">
<h1 class="form-title">安裝報告書</h1>
<p class="hint">填寫現場資料與檢查結果。完成後請客戶確認內容並於簽名區簽收。</p>
<div class="section">01｜客戶與設備資料</div>
<div class="grid">
<label class="field wide">公司名稱<input id="company" type="text" autocomplete="organization"></label>
<label class="field">聯絡電話<input id="phone" type="tel" autocomplete="tel"></label><label class="field">傳真<input id="fax" type="tel"></label>
<label class="field wide">地址<input id="address" type="text" autocomplete="street-address"></label>
<label class="field">現場聯絡人<input id="contact" type="text" autocomplete="name"></label>
<label class="field">機種品牌<select id="brand"><option value="">請選擇</option><option value="Videojet">Videojet</option><option value="Willett">Willett</option><option value="其他">其他</option></select></label><label class="field">機器型號<input id="model" type="text"></label>
<label class="field wide">機器序號<input id="serial" type="text"></label>
<label class="field">油墨型號<input id="inkType" type="text"></label><label class="field">稀釋液型號<input id="thinnerType" type="text"></label><label class="field wide">清潔液型號<input id="cleanerType" type="text"></label>
<label class="field">日期<input id="date" type="date"></label>
</div>
<div class="section">02｜現場狀況與安裝設定</div>
<div class="grid three">
<label class="field">同步器解析度<select id="resolution"><option value="">請選擇</option><option value="無">無</option><option value="500">500</option><option value="1000">1000</option><option value="2500">2500</option><option value="3600">3600</option><option value="5000">5000</option><option value="10000">10000</option></select></label><label class="field">生產速度<input id="productionSpeed" type="text"></label><label class="field">輸送速度<input id="conveyorSpeed" type="text"></label>

</div>
<div class="section">03｜檢查項目與配件</div>
<p class="hint">可複選機器檢查項目，配件可填數量。</p>
<div class="optiongrid" id="issues"></div>
<div class="section">配件確認</div><div class="grid" id="accessories"></div>
<div class="grid" style="margin-top:12px"><label class="field">機器問題說明<textarea id="machineNotes"></textarea></label><label class="field">配件問題說明<textarea id="accessoryNotes"></textarea></label></div>
<div class="section">04｜安裝測試結果</div><div id="results"></div>
<div class="section">05｜簽名確認</div>
<div class="signbox"><div class="signhead"><span>工程師簽名</span><div class="signbuttons"><button type="button" data-open-signature="engineer">全螢幕簽名</button><button type="button" data-clear="engineer">清除</button></div></div><canvas class="signcanvas" id="sig-engineer" width="700" height="240" aria-label="點此開啟工程師全螢幕簽名區"></canvas></div>
<div class="signbox"><div class="signhead"><span>客戶簽名</span><div class="signbuttons"><button type="button" data-open-signature="customer">全螢幕簽名</button><button type="button" data-clear="customer">清除</button></div></div><canvas class="signcanvas" id="sig-customer" width="700" height="240" aria-label="點此開啟客戶全螢幕簽名區"></canvas></div>

<div class="section">備註</div><textarea id="notes" style="width:100%"></textarea>
<div class="actions" style="margin-top:14px"><button class="primary" id="savePng" type="button">儲存／分享 PNG</button><button class="primary" id="savePdf" type="button">列印／另存 PDF</button><button class="primary" id="sharePdf" type="button">分享 PDF／LINE</button></div>
</section>
<section class="panel preview-panel"><p class="preview-caption">即時列印預覽｜A4 直式</p><div class="paper-wrap" id="paper"></div></section>
</main><div id="imageSaveModal" class="image-save-modal" role="dialog" aria-modal="true" aria-label="儲存安裝報告圖片" hidden><p>目前瀏覽器不支援直接下載。請長按下方圖片，選擇「下載圖片」或「儲存圖片」。</p><img id="saveImagePreview" alt="安裝報告書圖片"><button type="button" id="closeImagePreview">返回表單</button></div><div id="signatureModal" class="signature-modal" role="dialog" aria-modal="true" aria-label="全螢幕簽名" hidden><div class="signature-top"><span id="signatureTitle" class="signature-title">簽名</span><span class="signature-hint">請將手機橫向，簽名區會放大至全螢幕</span><div class="sig-actions"><button type="button" id="clearSignature">清除</button><button type="button" id="cancelSignature">取消</button><button type="button" id="confirmSignature" class="primary">完成簽名</button></div></div><canvas id="fullSignatureCanvas" class="signature-pad-full" width="1400" height="700" aria-label="全螢幕手寫簽名區"></canvas></div><div class="toast" id="toast"></div>
<script>
(()=>{
const issueList=['機器一切正常穩定','機器外觀良好','開機墨線良好','噴嘴、管路、回收管無漏墨','噴嘴堵塞或其它部份堵塞','螢幕無法正常顯示','噴印品質不良','其它問題（請於下方說明）'];
const accessoryList=[['墨水','瓶'],['稀釋液','瓶'],['清潔液','瓶'],['置機平台','台'],['落地架','組'],['噴頭夾具','組'],['清潔用具','組'],['操作手冊','本'],['三點組合','組'],['空壓機','台'],['同步器','組'],['橫移機器','台'],['輸送帶','台'],['其它','']];
const results=[['機器安裝測試後',['機器運轉正常','機器運轉不正常','機器需要調整']],['噴印功能',['完成達到','無法達到','修改增加']],['噴印品質',['噴印良好','效果不佳','調整改善']],['教育訓練',['初步完成','尚未完成','擇期安排']]];
const safe=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const inputIds=['company','phone','fax','address','contact','brand','model','serial','inkType','thinnerType','cleanerType','date','resolution','productionSpeed','conveyorSpeed','machineNotes','accessoryNotes','notes'];
const issuesEl=document.getElementById('issues'); issueList.forEach((s,i)=>issuesEl.insertAdjacentHTML('beforeend',`<label class="option"><input type="checkbox" id="issue${i}"><span>${s}</span></label>`));
const accEl=document.getElementById('accessories'); accessoryList.forEach(([s,u],i)=>accEl.insertAdjacentHTML('beforeend',`<label class="qty"><input id="accCheck${i}" type="checkbox" aria-label="勾選${s}"><span>${s}${u?'（'+u+'）':''}</span><input id="acc${i}" type="number" min="0" inputmode="numeric" placeholder="數量" aria-label="${s}數量"></label>`));
const resEl=document.getElementById('results'); results.forEach(([label,opts],i)=>{let html=`<div style="margin:8px 0"><div style="font-size:12px;color:var(--muted);font-weight:650;margin-bottom:6px">${label}</div><div class="optiongrid three">`;opts.forEach((o,j)=>html+=`<label class="option"><input type="radio" name="result${i}" value="${safe(o)}"><span>${o}</span></label>`);html+='</div></div>';resEl.insertAdjacentHTML('beforeend',html)});
const paths={engineer:[],customer:[]};const signatureWasPortrait={engineer:false,customer:false};const signatureCaptureSize={engineer:{width:1,height:1},customer:{width:1,height:1}};let signatureBackupPortrait=false,signatureBackupSize=null;
const signatureNames={engineer:'工程師簽名',customer:'客戶簽名'};
const signatureModal=document.getElementById('signatureModal');
const fullSignatureCanvas=document.getElementById('fullSignatureCanvas');
const fullSignatureContext=fullSignatureCanvas.getContext('2d');
let activeSignature=null, signatureBackup=[], drawingSignature=false, lockedScrollY=0;
function copyStrokes(strokes){return strokes.map(st=>st.map(p=>({x:p.x,y:p.y})))}
function drawStrokes(ctx,strokes,width,height,lineWidth=4){ctx.clearRect(0,0,width,height);ctx.strokeStyle='#153b55';ctx.lineWidth=lineWidth;ctx.lineCap='round';ctx.lineJoin='round';for(const stroke of strokes){if(!stroke.length)continue;ctx.beginPath();ctx.moveTo(stroke[0].x/1400*width,stroke[0].y/700*height);for(let i=1;i<stroke.length;i++)ctx.lineTo(stroke[i].x/1400*width,stroke[i].y/700*height);ctx.stroke()}}
function paintSignaturePreview(name){const cv=document.getElementById(`sig-${name}`);drawStrokes(cv.getContext('2d'),paths[name],cv.width,cv.height,3)}
function openSignature(name){activeSignature=name;signatureBackup=copyStrokes(paths[name]);signatureBackupPortrait=signatureWasPortrait[name];signatureBackupSize={...signatureCaptureSize[name]};document.getElementById('signatureTitle').textContent=signatureNames[name];drawStrokes(fullSignatureContext,paths[name],fullSignatureCanvas.width,fullSignatureCanvas.height,5);lockedScrollY=window.scrollY;document.body.style.position='fixed';document.body.style.top='-'+lockedScrollY+'px';document.body.style.left='0';document.body.style.right='0';signatureModal.hidden=false}
function closeSignature(keep){if(activeSignature===null)return;if(!keep){paths[activeSignature]=signatureBackup;signatureWasPortrait[activeSignature]=signatureBackupPortrait;signatureCaptureSize[activeSignature]=signatureBackupSize}paintSignaturePreview(activeSignature);signatureModal.hidden=true;document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';requestAnimationFrame(()=>window.scrollTo(0,lockedScrollY));activeSignature=null;signatureBackup=[];refresh()}
signatureModal.addEventListener("touchmove",e=>{if(activeSignature!==null)e.preventDefault()},{passive:false});for(const name of Object.keys(paths)){const cv=document.getElementById(`sig-${name}`);cv.addEventListener('click',()=>openSignature(name));document.querySelector(`[data-open-signature="${name}"]`).addEventListener('click',()=>openSignature(name))}
function signaturePoint(e){const r=fullSignatureCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*fullSignatureCanvas.width/r.width,y:(e.clientY-r.top)*fullSignatureCanvas.height/r.height}}
fullSignatureCanvas.addEventListener('pointerdown',e=>{if(activeSignature===null)return;drawingSignature=true;if(paths[activeSignature].length===0){signatureWasPortrait[activeSignature]=window.innerHeight>window.innerWidth;const r=fullSignatureCanvas.getBoundingClientRect();signatureCaptureSize[activeSignature]={width:r.width,height:r.height}}fullSignatureCanvas.setPointerCapture(e.pointerId);const p=signaturePoint(e);paths[activeSignature].push([p]);fullSignatureContext.beginPath();fullSignatureContext.moveTo(p.x,p.y);e.preventDefault()});
fullSignatureCanvas.addEventListener('pointermove',e=>{if(!drawingSignature||activeSignature===null)return;const p=signaturePoint(e);paths[activeSignature][paths[activeSignature].length-1].push(p);fullSignatureContext.lineTo(p.x,p.y);fullSignatureContext.stroke();e.preventDefault()});
const stopDrawing=()=>{drawingSignature=false};fullSignatureCanvas.addEventListener('pointerup',stopDrawing);fullSignatureCanvas.addEventListener('pointercancel',stopDrawing);
document.getElementById('clearSignature').addEventListener('click',()=>{if(activeSignature===null)return;paths[activeSignature]=[];signatureWasPortrait[activeSignature]=window.innerHeight>window.innerWidth;const r=fullSignatureCanvas.getBoundingClientRect();signatureCaptureSize[activeSignature]={width:r.width,height:r.height};drawStrokes(fullSignatureContext,[],fullSignatureCanvas.width,fullSignatureCanvas.height,5)});
document.getElementById('cancelSignature').addEventListener('click',()=>closeSignature(false));document.getElementById('confirmSignature').addEventListener('click',()=>closeSignature(true));
document.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.clear;paths[n]=[];paintSignaturePreview(n);refresh()}));
function val(id){return document.getElementById(id).value.trim()}
function text(x,y,s,size=14,fill='#20303b',weight=400){return `<text x="${x}" y="${y}" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="${size}" font-weight="${weight}" fill="${fill}">${safe(s)}</text>`}
function ln(x1,y1,x2,y2,stroke='#d9e1e7',width=1){return `<path d="M${x1} ${y1}H${x2}" stroke="${stroke}" stroke-width="${width}"/>`}
function box(x,y,w,h,stroke='#d9e1e7',fill='none',r=2){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`}
function section(y,title){return `${box(42,y,710,26,'#e5ebef','#f2f5f7',3)}<rect x="42" y="${y}" width="5" height="26" rx="2" fill="#183b56"/>${text(56,y+18,title,19,'#183b56',700)}`}
function field(x,y,w,label,value){return `${text(x,y,label,16.5,'#607482',600)}<rect x="${x}" y="${y+4}" width="${w}" height="18" rx="3" fill="#fff" stroke="#cbd6de" stroke-width="1"/>${value?text(x+6,y+18,value,17.5,'#20303b'):''}`}
function lineField(x,y,w,label,value){return `${text(x,y,label,16.5,'#607482',600)}${value?text(x,y+16,value,17.5,'#20303b'):''}${ln(x,y+23,x+w,y+23,'#b9c7d1',1)}`}
function mark(x,y,checked,size=14){let out=box(x,y-size+2,size,size,checked?'#183b56':'#607482',checked?'#183b56':'white',2);if(checked)out+=`<path d="M${x+3} ${y-size/2+2}l3 3 6-7" stroke="white" stroke-width="1.8" fill="none"/>`;return out}
function signPath(name,x,y,w,h){
const strokes=paths[name],size=signatureCaptureSize[name],points=strokes.flat().map(p=>({x:p.x/1400*size.width,y:p.y/700*size.height}));if(!points.length)return'';
let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const p of points){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}
const width=maxX-minX||1,height=maxY-minY||1,rotate=signatureWasPortrait[name];
const transformed=strokes.map(st=>st.map(p=>{const px=p.x/1400*size.width,py=p.y/700*size.height;return rotate?{x:py-minY,y:maxX-px}:{x:px-minX,y:py-minY}}));
const fitWidth=rotate?height:width,fitHeight=rotate?width:height,scale=Math.min(w/fitWidth,h/fitHeight)*0.9,offsetX=x+(w-fitWidth*scale)/2,offsetY=y+(h-fitHeight*scale)/2;
return transformed.map(st=>{if(!st.length)return'';let d='M'+(offsetX+st[0].x*scale)+' '+(offsetY+st[0].y*scale);for(let i=1;i<st.length;i++)d+=' L'+(offsetX+st[i].x*scale)+' '+(offsetY+st[i].y*scale);return '<path d="'+d+'" fill="none" stroke="#153b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'}).join('')
}
function wrapLines(s,max=58,maxLines=8){let out=[];while(s.length>max){out.push(s.slice(0,max));s=s.slice(max)}if(s)out.push(s);return out.slice(0,maxLines)}
function reportHeader(a,continued,page){a.push(`<svg class="report-page" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" role="img" aria-label="安裝報告書第${page}頁"><rect width="794" height="1123" fill="white"/>`);a.push(text(42,32,'TID  /  啟益科技',14,'#607482',700),text(42,65,'安裝報告書',29,'#183b56',700));if(continued)a.push(text(190,64,'（續）',16,'#607482',500));a.push(field(620,58,132,'日期',val('date')),ln(42,103,752,103,'#183b56',1.5))}
function render(){let a=[];reportHeader(a,false,1);

function refresh(){render()}
document.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',refresh));document.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(el=>el.addEventListener('change',refresh));
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function renderFormCanvases(){const svgs=[...document.querySelectorAll('#paper svg')];return Promise.all(svgs.map(svg=>new Promise((resolve,reject)=>{const xml=new XMLSerializer().serializeToString(svg),blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=2480;cv.height=3508;const ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);resolve(cv)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('render failed'))};img.src=url}))) }
function combinePages(pages){const cv=document.createElement('canvas');cv.width=pages[0].width;cv.height=pages[0].height*pages.length;const ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,cv.width,cv.height);pages.forEach((page,i)=>ctx.drawImage(page,0,i*page.height));return cv}
function canvasBlob(canvas,type,quality){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('export failed')),type,quality))}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function isMobileDevice(){return Boolean(navigator.userAgentData?.mobile)||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/i.test(navigator.userAgent)&&navigator.maxTouchPoints>1)}
function showImageSavePreview(blob){const url=URL.createObjectURL(blob);const img=document.getElementById('saveImagePreview');img.src=url;document.getElementById('imageSaveModal').hidden=false;document.getElementById('closeImagePreview').onclick=()=>{document.getElementById('imageSaveModal').hidden=true;img.removeAttribute('src');URL.revokeObjectURL(url)}}
async function shareOrDownload(blob,name,type,title,success,fallback){if(!isMobileDevice()){downloadBlob(blob,name);notify(type==='application/pdf'?'PDF 已下載，請在電腦版 LINE 聊天視窗附加檔案傳送':'PNG 已下載，請在 LINE 聊天室附加檔案傳送');return}const file=new File([blob],name,{type});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});notify(success);return}}catch(e){if(e.name==='AbortError')return}if(type==='image/png'){showImageSavePreview(blob);return}downloadBlob(blob,name);notify(fallback)}
async function exportPng(){try{const pages=await renderFormCanvases(),cv=combinePages(pages),blob=await canvasBlob(cv,'image/png');await shareOrDownload(blob,'安裝報告書.png','image/png','安裝報告書','已開啟手機分享選單','PNG 已下載，請到手機下載項目查看')}catch(e){notify('匯出圖片失敗，請稍後再試')}}
function makePdfBlob(canvases){const enc=new TextEncoder(),chunks=[];let length=0;const push=b=>{chunks.push(b);length+=b.length};const count=2+canvases.length*3,offsets=Array(count+1).fill(0);push(enc.encode('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));const obj=(n,body)=>{offsets[n]=length;push(enc.encode(`${n} 0 obj\n${body}\nendobj\n`))};obj(1,'<< /Type /Catalog /Pages 2 0 R >>');const refs=canvases.map((_,i)=>`${3+i*3} 0 R`).join(' ');obj(2,`<< /Type /Pages /Kids [${refs}] /Count ${canvases.length} >>`);canvases.forEach((canvas,i)=>{const page=3+i*3,image=page+1,contentObj=page+2,jpgUrl=canvas.toDataURL('image/jpeg',0.96),binary=atob(jpgUrl.split(',')[1]),jpeg=new Uint8Array(binary.length);for(let j=0;j<binary.length;j++)jpeg[j]=binary.charCodeAt(j);obj(page,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${image} 0 R >> >> /Contents ${contentObj} 0 R >>`);offsets[image]=length;push(enc.encode(`${image} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`));push(jpeg);push(enc.encode('\nendstream\nendobj\n'));const stream='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';obj(contentObj,`<< /Length ${enc.encode(stream).length} >>\nstream\n${stream}endstream`) });const xref=length;let table=`xref\n0 ${count+1}\n0000000000 65535 f \n`;for(let i=1;i<=count;i++)table+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';table+=`trailer\n<< /Size ${count+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;push(enc.encode(table));return new Blob(chunks,{type:'application/pdf'})}
async function sharePdf(){try{const canvases=await renderFormCanvases(),blob=makePdfBlob(canvases);await shareOrDownload(blob,'安裝報告書.pdf','application/pdf','安裝報告書','已開啟分享選單，請選 LINE 傳送','PDF 已下載；可從手機檔案選擇分享至 LINE')}catch(e){notify('產生 PDF 失敗，請改用列印／另存 PDF')}}
